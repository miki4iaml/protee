<title>Surface&#45;layer scales of COARE 3.6, solved together (COARE 3.6 code)</title>
<g id="a_graph0"><a xlink:title="The loop of the code (lines 480 to 595) over the formulations of the catalog, in the order of the code: the Obukhov length from the scales of the previous pass, the roughness lengths, the scales, the gustiness, the wind with it, the neutral wind at 10 m and the Charnock coefficient. Its unknowns, read before they are computed in a pass, are the three scales, the Charnock coefficient and the wind with gustiness. The code runs 10 passes without a test of convergence (line 473); Newton&#39;s method solves the equations themselves. The first guess is simpler than the code&#39;s (lines 380 to 477, which take psiu_40 and a relation from the bulk Richardson number, not in the catalog): the scales of a neutral profile, k / ln(17 m / 1e&#45;4 m) = 0.033 times the differences between air and surface (for the temperature with the lapse g z_t / c_pa, as dT of line 383), a gustiness of 0.5 m/s, and a Charnock coefficient of 0.011, which the code sets at line 452 and replaces by a1 u10 + a2 at line 457. Left out: the cool skin, which the code computes in the loop, and the warm layer, which a separate function computes before calling it (line 35), the surface temperature and humidity being inputs (the skin temperature and Qs of the output of the code, in its test data); the Charnock coefficient from the waves where they are given (lines 463 to 477 and 592 to 595), the system being the code run without them; and, where its first guess gives zeta_u &gt; 50 (line 431), the scales of the first pass and the Obukhov length it started from, which the code keeps (lines 578 to 586 and 600 to 607), where the system gives the solution of its equations. Over ice, the code takes z_0 = 5e&#45;4 m (line 484): not here. Below 2.94 m/s the Charnock coefficient is negative, beyond the bounds of its kind; the code takes it, its smooth&#45;flow term keeping the roughness length positive (outside = ignore for both).">
<polygon fill="white" stroke="none" points="-4,4 -4,-151.75 778,-151.75 778,4 -4,4"/>
