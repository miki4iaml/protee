[project]
name = "protee"
version = "0.3.0"
description = "Proteus: graph and operations research algorithms whose methods are chosen explicitly, compared, and backed by certificates and diagnostics"
readme = "README.md"
authors = [
    { name = "miki4ia", email = "miki4ia@gmail.com" }
]
requires-python = ">=3.12"
# The drawing page embeds third-party JavaScript under the MIT licence; the
# embedded value set reuses a public text under the Licence Ouverte 2.0,
# credited in its notice.
license = "BSD-3-Clause AND MIT AND etalab-2.0"
license-files = ["LICENSE", "src/protee/_assets/*.LICENSE.*"]
keywords = [
    "operations research",
    "optimization",
    "graphs",
    "life cycle",
    "life-cycle profile",
    "network flows",
    "shortest paths",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    # Lower bounds: the first releases with wheels for Python 3.14 (kept for
    # 3.12 and 3.13, whose first releases with wheels are past the support
    # window of SPEC 0), and for Python 3.15.
    "numpy>=2.3.2 ; python_full_version < '3.15'",
    "numpy>=2.5.2 ; python_full_version >= '3.15'",
    "scipy>=1.16.1 ; python_full_version < '3.15'",
    "scipy>=1.18.1 ; python_full_version >= '3.15'",
]

[project.urls]
Homepage = "https://github.com/miki4iaml/protee"
Repository = "https://github.com/miki4iaml/protee"
Issues = "https://github.com/miki4iaml/protee/issues"
Changelog = "https://github.com/miki4iaml/protee/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Pure Python: the lower bound is the first release that supports
# Python 3.14.
units = [
    "pint>=0.26",
]
viz = [
    "pygraphviz>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "coverage>=7.16.2",
    # Test oracles (independent solvers) and property-based tests; highspy
    # 1.16.0 is the first release with CPython 3.15 wheels.
    "highspy>=1.16.0",
    "hypothesis>=6.170.14",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "networkx>=3.7",
    "pre-commit>=4.6.2",
    "pygraphviz>=2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "zizmor>=1.30.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "docs"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# networkx, pygraphviz and jsonschema ship no type hints; in the tests,
# they are oracles (pygraphviz is also the optional extra viz).
module = [
    "jsonschema",
    "jsonschema.*",
    "networkx",
    "networkx.*",
    "pygraphviz",
    "pygraphviz.*",
]
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--showlocals"]
log_level = "INFO"

[tool.coverage.run]
branch = true
# Explicit: the hook scripts are loaded from their path by importlib.
source = ["src/protee", "scripts"]
# Same paths on Windows and Linux, so that reports can be merged.
relative_files = true

[tool.coverage.report]
# Floor, not target: the actual rate is visible in the reports.
fail_under = 80
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff.format]
# The documents keep their own layout (aligned comments).
exclude = ["*.md"]

[tool.ruff.lint]
# On top of ruff's default selection, which Dependabot bumps surface in CI.
extend-select = ["ARG", "B", "C4", "I002", "PIE", "PT", "PTH", "RET", "T20"]

[tool.ruff.lint.isort]
# Annotations are evaluated lazily on every supported Python version.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Fixtures requested for their side effects look like unused arguments.
"tests/**" = ["ARG001"]
# The hooks are command-line tools: printing is their output. They are
# shared with other repositories and keep their own imports.
"scripts/**" = ["T20", "I002"]

[tool.codespell]
skip = "*.fr.md,uv.lock,src/protee/_assets/*.js"
# Format terms: the Flate filter of PDF, the ALPH chunk of WebP.
ignore-words-list = "flate,alph"

[tool.repo-review.ignore]
PC110 = "ruff format runs as a local hook through uv run --frozen (single version source: uv.lock)"
PC140 = "mypy runs as a local hook through uv run --frozen (single version source: uv.lock)"
PC160 = "codespell runs as a local hook through uv run --frozen (single version source: uv.lock)"
PC190 = "ruff check runs as a local hook through uv run --frozen (single version source: uv.lock)"
SEC001 = "zizmor runs as a local hook through uv run --frozen (single version source: uv.lock)"
PC901 = "pre-commit.ci is not used; CI replays the hooks itself"
PC902 = "pre-commit.ci is not used; CI replays the hooks itself"
PC903 = "pre-commit.ci is not used; CI replays the hooks itself"
PC180 = "no markdown formatter, by choice (dependency control, hand-written texts)"
PY007 = "uv run is the task runner, identical on every OS"
PY004 = "temporary: documentation not started yet"
PC170 = "temporary: no reStructuredText until the documentation exists"
