[rulebook]
id = "fr-oversize-transport-2006"
kind = "regulation"
edition = "consolidated, in force on 2026-11-18"
link = "https://www.legifrance.gouv.fr/loda/id/LEGITEXT000006053685"

[rulebook.title]
en = "Order of 4 May 2006 on exceptional transport (France)"
fr = "Arrêté du 4 mai 2006 relatif aux transports exceptionnels de marchandises, d'engins ou de véhicules et ensembles de véhicules comportant plus d'une remorque"

[source]
document = "Arrêté du 4 mai 2006 relatif aux transports exceptionnels"
citation_checked = true

